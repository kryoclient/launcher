name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale drafts for this tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft == true and (.tag_name == \"$GITHUB_REF_NAME\" or .tag_name == \"\")) | .id" \
            | while read -r id; do
                echo "deleting draft release $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release once
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/${version}/g" .github/release-notes.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "KRYO Client $version" --notes-file notes.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --title "KRYO Client $version" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Build and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checksums
        if: matrix.os == 'windows-latest'
        run: npm run checksums

      - name: Attach checksums to the release
        if: matrix.os == 'windows-latest'
        run: gh release upload "${{ github.ref_name }}" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
